
name: Build Global Translate APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GlobalTranslate.zip -d source

      - name: Build APK
        run: gradle -p source/GlobalTranslateKeyboard assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalTranslate-APK
          path: source/GlobalTranslateKeyboard/app/build/outputs/apk/debug/app-debug.apk
